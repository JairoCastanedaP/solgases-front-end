<nav class="main-nav">
  <div class="container container--flex">
    <span
      class="icon-menu"
      role="button"
      tabindex="0"
      aria-label="Abrir o cerrar menú"
      aria-controls="menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
      (keydown.enter)="toggleMenu()"
    ></span>
    <ul class="menu" id="menu" [class.mostrar]="menuOpen()">
      @for (item of items; track item.path) {
        <li class="menu__item">
          <a
            class="menu__link"
            [routerLink]="item.path"
            routerLinkActive="menu__link--select"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            (click)="closeMenu()"
            >{{ item.label }}</a
          >
        </li>
      }
    </ul>
    <!-- En el sitio original estos iconos tenían href="" (sin destino real). -->
    <div class="social-icon">
      <a class="social-icon__link"><span class="icon-mail"></span></a>
      <a class="social-icon__link"><span class="icon-location"></span></a>
      <a class="social-icon__link"><span class="icon-phone"></span></a>
    </div>
  </div>
</nav>
