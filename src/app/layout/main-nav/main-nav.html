<nav class="main-nav">
  <div class="container container--flex">
    <span
      class="icon-menu"
      role="button"
      tabindex="0"
      aria-label="Abrir o cerrar menú"
      aria-controls="menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
      (keydown.enter)="toggleMenu()"
    ></span>
    <ul class="menu" id="menu" [class.mostrar]="menuOpen()">
      @for (item of items; track item.path) {
        <li class="menu__item">
          <a
            class="menu__link"
            [routerLink]="item.path"
            routerLinkActive="menu__link--select"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            (click)="closeMenu()"
            >{{ item.label }}</a
          >
        </li>
      }
    </ul>
    <div class="social-icon">
      @for (contact of contacts; track contact.topic) {
        <button
          #trigger
          type="button"
          class="social-icon__link"
          aria-haspopup="dialog"
          [attr.aria-label]="contact.label"
          (click)="dialog.open(contact.topic, trigger)"
        >
          @switch (contact.topic) {
            @case ('facebook') {
              <span class="icon-brand" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path
                    fill="currentColor"
                    d="M14 8.5V6.8c0-.8.5-1 1-1h2V2.5h-2.8C11.3 2.5 10 4.5 10 6.6v1.9H7.5V12H10v9.5h4V12h2.7l.4-3.5z"
                  />
                </svg>
              </span>
            }
            @case ('instagram') {
              <span class="icon-brand" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <rect
                    x="3.5"
                    y="3.5"
                    width="17"
                    height="17"
                    rx="5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  />
                  <circle cx="17" cy="7" r="1.3" fill="currentColor" />
                </svg>
              </span>
            }
            @default {
              <span [class]="contact.icon" aria-hidden="true"></span>
            }
          }
        </button>
      }
    </div>
  </div>
</nav>

<app-contact-dialog #dialog />
