@if (url) {
  <a
    class="whatsapp"
    [href]="url"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Escríbenos para asesorarte por WhatsApp (se abre en una pestaña nueva)"
  >
    <app-whatsapp-icon class="whatsapp__icon" />
    <span class="whatsapp__label">Escríbenos para asesorarte</span>
  </a>
} @else {
  <button
    type="button"
    class="whatsapp whatsapp--pending"
    aria-disabled="true"
    aria-label="Escríbenos para asesorarte por WhatsApp"
    aria-describedby="whatsapp-pendiente"
  >
    <app-whatsapp-icon class="whatsapp__icon" />
    <span class="whatsapp__label">Escríbenos para asesorarte</span>
    <span id="whatsapp-pendiente" class="whatsapp__tooltip">
      Número de WhatsApp pendiente de configurar
    </span>
  </button>
}
