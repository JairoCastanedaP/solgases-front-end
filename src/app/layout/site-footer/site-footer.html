      <h2 class="column__title">Correo</h2>
      <p class="columns__txt">

      </p>
    </div>
    <div class="column column--33">
      <h2 class="column__title">Teléfono</h2>
      <p class="columns__txt">
        <a class="icon-phone">{{ site.phone }}</a>

    <div class="column column--33">

      <p class="columns__txt">
        <a class="icon-location">{{ site.address }}</a>
      </p>
