<header class="main-header">
  <div class="container container--flex main-header__row">
    <div class="logo-container column column--50">
      <p class="logo">{{ site.name }}</p>
    </div>
    <!-- Solo informativo: la cuenta de usuario aún no existe, por eso no hay enlaces ni rutas. -->
    <div class="account" role="group" aria-label="Cuenta de usuario, próximamente disponible">
      <span class="account__soon">Próximamente</span>
      <div class="account__options">
        <button type="button" class="account__option" disabled>Iniciar sesión</button>
        <button type="button" class="account__option" disabled>Crear cuenta</button>
      </div>
    </div>
    <div class="main-header__contactInfo column column--50">
      <p class="main-header__contactInfo__phone">
        <span class="icon-phone">{{ site.phone }}</span>
      </p>
      <p class="main-header__contactInfo__address">
        <span class="icon-location">{{ site.address }}</span>
      </p>
    </div>
  </div>
</header>
