<div class="group gallery">
  <ng-content />
  <div class="container container--flex">
    @for (column of columns(); track $index) {
      <div class="column--50-25">
        @for (image of column; track $index) {
          @let img = image.src | optimizedImage;
          <img
            [ngSrc]="img.src"
            [width]="img.width"
            [height]="img.height"
            class="gallery__img"
            [class.gallery__img--big]="image.size === 'big'"
            [class.gallery__img--small]="image.size === 'small'"
            [alt]="image.alt"
            (click)="open(image)"
          />
        }
      </div>
    }
  </div>
</div>

<div class="modal" [class.modal--open]="selectedImage() !== null">
  <div class="modal__content">
    @if (selectedImage(); as image) {
      <img [src]="(image.src | optimizedImage).src" [alt]="image.alt" class="modal__img" />
    }
  </div>
  <div
    class="modal__boton"
    role="button"
    tabindex="0"
    aria-label="Cerrar imagen"
    (click)="close()"
    (keydown.enter)="close()"
  >
    X
  </div>
</div>
